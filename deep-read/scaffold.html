<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0b0d;
      --ink: #f3f2ed;
      --muted: #a9adb4;
      --dim: #747b86;
      --line: #2a3039;
      --panel: #14171c;
      --panel-2: #191d23;
      --green: #8bd17c;
      --teal: #52c7bd;
      --amber: #f0bc58;
      --red: #ff746c;
      --blue: #83aaff;
      --violet: #c4a1ff;
      --radius: 8px;
      --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      --sans: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --serif: ui-serif, Georgia, Cambria, "Times New Roman", Times, serif;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.55;
    }

    a { color: var(--teal); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: minmax(230px, 300px) minmax(0, 1fr);
      min-height: 100vh;
    }

    aside {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 26px 22px;
      border-right: 1px solid var(--line);
      background: #0d0f12;
      overflow: auto;
    }

    .mark {
      width: 38px;
      height: 38px;
      margin-bottom: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      display: grid;
      place-items: center;
      background: var(--panel);
      color: var(--amber);
      font-family: var(--mono);
      font-size: 13px;
      font-weight: 700;
    }

    .nav-title { margin: 0 0 8px; font-size: 19px; line-height: 1.15; }
    .nav-copy  { margin: 0 0 22px; color: var(--muted); font-size: 13px; }

    nav { display: grid; gap: 4px; }

    nav a {
      display: block;
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
    }

    nav a:hover { background: var(--panel); color: var(--ink); text-decoration: none; }

    .nav-group {
      margin-top: 12px;
      padding: 6px 10px 4px;
      color: var(--dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* ── Main ── */
    main {
      width: min(1220px, 100%);
      padding: 56px clamp(20px, 5vw, 76px) 92px;
    }

    .hero { max-width: 960px; margin-bottom: 48px; }

    .kicker {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-bottom: 20px;
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--muted);
      background: var(--panel);
      font-size: 13px;
    }

    .kicker span { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }

    h1 {
      margin: 0;
      max-width: 920px;
      font-family: var(--serif);
      font-size: clamp(44px, 7vw, 92px);
      line-height: 0.95;
    }

    .dek {
      max-width: 820px;
      margin: 24px 0 0;
      color: var(--muted);
      font-size: clamp(18px, 2.3vw, 24px);
      line-height: 1.45;
    }

    section { margin: 62px 0; }

    .section-heading {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 24px;
      align-items: start;
      margin-bottom: 24px;
    }

    .section-number { color: var(--dim); font-family: var(--mono); font-size: 13px; padding-top: 6px; }

    h2 { margin: 0; font-size: clamp(30px, 4vw, 48px); line-height: 1.05; }
    h3 { margin: 0 0 10px; font-size: 20px; line-height: 1.2; }

    p { margin: 0 0 16px; color: var(--muted); }
    p:last-child { margin-bottom: 0; }

    .lead { max-width: 840px; color: #deded8; font-size: 18px; }

    /* ── Grids & Cards ── */
    .grid-2, .grid-3, .grid-4 { display: grid; gap: 14px; }
    .grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }

    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .card p:last-child { margin-bottom: 0; }

    .hero-cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      margin-top: 30px;
    }

    .hero-card {
      min-height: 132px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .hero-card strong { display: block; margin-bottom: 8px; font-size: 22px; }
    .hero-card span { color: var(--muted); font-size: 14px; }

    /* ── Chips ── */
    .chip {
      display: inline-flex;
      align-items: center;
      margin-bottom: 12px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #22262c;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
    }

    .chip.green  { color: var(--green); }
    .chip.teal   { color: var(--teal); }
    .chip.amber  { color: var(--amber); }
    .chip.red    { color: var(--red); }
    .chip.blue   { color: var(--blue); }
    .chip.violet { color: var(--violet); }

    /* ── Callout ── */
    .callout {
      margin: 24px 0;
      padding: 18px 20px;
      border-left: 3px solid var(--teal);
      border-radius: var(--radius);
      background: var(--panel-2);
      color: #dde4e2;
    }

    .callout p:last-child { margin-bottom: 0; }

    /* ── Diagram ── */
    .diagram {
      margin-top: 26px;
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel-2);
      overflow-x: auto;
    }

    svg { display: block; max-width: 100%; height: auto; }

    /* ── Matrix table ── */
    .matrix {
      width: 100%;
      border-collapse: collapse;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .matrix th, .matrix td {
      padding: 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .matrix th {
      background: #1c2026;
      color: var(--ink);
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0;
    }

    .matrix td { color: var(--muted); font-size: 14px; }
    .matrix tr:last-child td { border-bottom: 0; }

    /* ── Chooser (interactive option panel) ── */
    .chooser {
      display: grid;
      grid-template-columns: minmax(220px, 300px) minmax(0, 1fr);
      gap: 16px;
      margin-top: 18px;
    }

    .option-list { display: grid; gap: 8px; }

    .option {
      appearance: none;
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 12px;
      background: var(--panel);
      color: var(--muted);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }

    .option[aria-pressed="true"] { border-color: var(--teal); color: var(--ink); background: #162322; }

    .play-panel {
      min-height: 260px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .play-panel ul { margin: 12px 0 0; padding-left: 18px; color: var(--muted); }
    .play-panel li { margin-bottom: 8px; }

    /* ── Code ── */
    code, pre { font-family: var(--mono); }

    code { padding: 2px 5px; border-radius: 4px; color: #dce8e5; background: #191d23; }

    pre {
      margin: 0 0 18px;
      padding: 16px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: #101216;
      color: #dce8e5;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ── Prompt card with copy button ── */
    .prompt-card { position: relative; }

    .copy {
      position: absolute;
      top: 10px;
      right: 10px;
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #20242a;
      color: var(--muted);
      padding: 8px 10px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── List ── */
    .list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .list li {
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      background: #111317;
    }

    /* ── Timeline ── */
    .timeline { display: grid; gap: 14px; }

    .step {
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 14px;
      align-items: start;
    }

    .badge {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid var(--line);
      border-radius: 50%;
      background: var(--panel);
      color: var(--ink);
      font-family: var(--mono);
      font-size: 12px;
    }

    /* ── Source questions (hidden by default, expand for context) ── */
    .source-q {
      margin-top: 20px;
      padding: 10px 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--dim);
      font-size: 13px;
    }

    .source-q summary { cursor: pointer; user-select: none; color: var(--dim); }
    .source-q summary:hover { color: var(--muted); }
    .source-q ul { margin: 10px 0 0; padding-left: 18px; color: var(--dim); }
    .source-q li { margin-bottom: 5px; line-height: 1.5; }

    /* ── Footer ── */
    footer {
      margin-top: 72px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 13px;
    }

    /* ── Responsive ── */
    @media (max-width: 960px) {
      .layout { display: block; }
      aside { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-cards, .grid-2, .grid-3, .grid-4, .chooser { grid-template-columns: 1fr; }
      .section-heading { grid-template-columns: 1fr; gap: 8px; }
    }

    @media (max-width: 560px) {
      main { padding: 36px 16px 70px; }
      nav { grid-template-columns: 1fr; }
      .matrix { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
  <div class="layout">

    <aside>
      <div class="mark">{{MARK}}</div>
      <h2 class="nav-title">{{NAV_TITLE}}</h2>
      <p class="nav-copy">{{NAV_COPY}}</p>
      <nav aria-label="Document sections">
        <!-- NAV LINKS GO HERE -->
      </nav>
    </aside>

    <main>
      <!-- CONTENT GOES HERE -->

      <footer>{{FOOTER}}</footer>
    </main>

  </div>

  <script>
    /* Copy button pattern — wire up any .copy button pointing to a target element:
       <button class="copy" data-copy="#target-id">Copy</button>
       Only include this script block if the document uses copy buttons. */
    document.querySelectorAll("[data-copy]").forEach((button) => {
      button.addEventListener("click", async () => {
        const target = document.querySelector(button.getAttribute("data-copy"));
        if (!target) return;
        await navigator.clipboard.writeText(target.textContent.trim());
        const original = button.textContent;
        button.textContent = "Copied";
        setTimeout(() => { button.textContent = original; }, 1200);
      });
    });
  </script>
</body>
</html>
